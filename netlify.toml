[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[dev]
  framework = "vite"
  command = "npm run vite"
  targetPort = 5173
  port = 8888

[[redirects]]
  from = "/api/movies/*/cast"
  to = "/.netlify/functions/movie-cast/:splat/cast"
  status = 200

[[redirects]]
  from = "/api/actors/*"
  to = "/.netlify/functions/actors/:splat"
  status = 200

[[redirects]]
  from = "/api/directors/*"
  to = "/.netlify/functions/directors/:splat"
  status = 200

[[redirects]]
  from = "/api/tv/*"
  to = "/.netlify/functions/tv/:splat"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/docs"
  to = "/docs/index.html"
  status = 200

[[redirects]]
  from = "/docs/*"
  to = "/docs/index.html"
  status = 200

# Keep the single-page app fallback after the API rules. Declaring it explicitly
# prevents the Vite integration from injecting it before the function rewrites.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
